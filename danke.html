<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Vielen Dank für Ihre Anfrage – Webpeak</title>
    <link href="./webpeak-local-assets/webpeak-main.css" rel="stylesheet" type="text/css" />
    <link href="./webpeak-local-assets/webpeak-favicon.png" rel="shortcut icon" type="image/png" />
    <style>
      html, body { min-height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 1.5rem; background: #f1f1f1; }
      .thanks-card { width: min(100%, 46rem); padding: clamp(2rem, 6vw, 5rem); border-radius: 2rem; background: #fff; text-align: center; }
      .thanks-card img { width: 11rem; height: auto; margin-bottom: 2rem; }
      .thanks-card h1 { margin: 0 0 1rem; font-size: clamp(2.5rem, 7vw, 4.5rem); line-height: 1; }
      .thanks-card p { max-width: 34rem; margin: 0 auto 2rem; font-size: 1.15rem; }
    </style>
  </head>
  <body>
    <main class="thanks-card">
      <img src="./webpeak-local-assets/webpeak-logo.png" alt="Webpeak" />
      <div class="tag">Anfrage erhalten</div>
      <h1>Vielen Dank.</h1>
      <p>Wir haben Ihre Anfrage erhalten, prüfen Ihr Projekt und melden uns persönlich bei Ihnen.</p>
      <a href="https://webpeak.ch/" class="button is-primary w-button">Zurück zur Startseite</a>
    </main>
  </body>
</html>
