<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Vielen Dank für Ihre Anfrage | Webpeak</title>
  <link rel="icon" href="/webpeak-local-assets/webpeak-favicon.png" type="image/png">
  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("/webpeak-local-assets/7a4170bef1-697f8324cf1ddb096d556fcb_Space-Grotesk-Variable-Font.woff2") format("woff2");
      font-display: swap;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      display: grid;
      place-items: center;
      color: #1a1c1c;
      background: #eef4f7;
      font-family: "Space Grotesk", Arial, sans-serif;
    }

    main {
      position: relative;
      width: min(100%, 58rem);
      padding: clamp(2rem, 7vw, 5rem);
      overflow: hidden;
      border-radius: clamp(2rem, 6vw, 4rem);
      background: #fff;
    }

    main::after {
      content: "";
      position: absolute;
      right: -8rem;
      bottom: -11rem;
      width: 28rem;
      height: 28rem;
      border-radius: 50%;
      background: #cfe3ee;
      opacity: .65;
    }

    img { width: 10rem; height: auto; }

    .tag {
      display: inline-block;
      margin-top: 3rem;
      padding: .35rem .9rem;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: .75rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      max-width: 13ch;
      margin: 1.25rem 0;
      font-size: clamp(2.6rem, 8vw, 5.5rem);
      line-height: .98;
      letter-spacing: -.045em;
    }

    p {
      position: relative;
      z-index: 1;
      max-width: 34rem;
      margin: 0;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <img src="/webpeak-local-assets/webpeak-logo.png" alt="Webpeak">
    <div class="tag">Anfrage erhalten</div>
    <h1>Vielen Dank für Ihre Anfrage.</h1>
    <p>Wir prüfen Ihre Angaben und melden uns persönlich bei Ihnen, um die nächsten Schritte zu besprechen.</p>
  </main>
</body>
</html>
